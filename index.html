  <!-- Babel compiler React JSX'ui -->

  <!-- Lucide Icons -->

</head>
<body class="bg-slate-50 text-slate-900">

        days: 'Darbo dienomis',
        stops: [{ name: 'Ignalina', time: '05:05' }, { name: 'Kylatrakis', time: '05:08' }, { name: 'Ažėnai', time: '05:10' }, { name: 'Pašvoginė', time: '05:12' }, { name: 'Kazitiškis', time: '05:15' }, { name: 'Rupinsko kryžkelė', time: '05:18' }, { name: 'Malvinavas', time: '05:20' }, { name: 'Meilūnai', time: '05:24' }, { name: 'Ligūnai', time: '05:28' }, { name: 'Tumalinė', time: '05:32' }, { name: 'Dūkštas', time: '05:37' }, { name: 'Vaškonys', time: '05:42' }, { name: 'Beržininkai', time: '05:45' }, { name: 'Bėgūnai', time: '05:47' }, { name: 'Kalviškis', time: '05:49' }, { name: 'Magūnai', time: '05:53' }, { name: 'Statybos bazė', time: '05:57' }, { name: 'Sankryža', time: '05:59' }, { name: 'Sandėlis', time: '06:02' }, { name: 'Visaginas I', time: '06:06' }, { name: 'Visaginas II', time: '06:07' }],
      },
      {
        id: '52-out-2',
        routeNumber: '52',
        routeName: 'VISAGINAS PER DŪKŠTĄ',
        direction: 'Išvykimas',
        days: 'Darbo dienomis',
        stops: [{ name: 'Ignalina', time: '11:30' }, { name: 'Kylatrakis', time: '11:40' }, { name: 'Ažėnai', time: '11:43' }, { name: 'Pašvoginė', time: '11:45' }, { name: 'Kazitiškis', time: '11:50' }, { name: 'Rupinsko kryžkelė', time: '11:54' }, { name: 'Malvinavas', time: '11:57' }, { name: 'Meilūnai', time: '12:02' }, { name: 'Ligūnai', time: '12:07' }, { name: 'Tumalinė', time: '12:11' }, { name: 'Dūkštas', time: '12:15' }, { name: 'Vaškonys', time: '12:20' }, { name: 'Beržininkai', time: '12:23' }, { name: 'Bėgūnai', time: '12:25' }, { name: 'Kalviškis', time: '12:27' }, { name: 'Magūnai', time: '12:31' }, { name: 'Statybos bazė', time: '12:35' }, { name: 'Sankryža', time: '12:37' }, { name: 'Sandėlis', time: '12:40' }, { name: 'Visaginas I', time: '12:44' }, { name: 'Visaginas II', time: '12:45' }],
      },
      {
        id: '53-out-1',
        routeNumber: '53',
        routeName: 'IGNALINA- N. DAUGĖLIŠKIS',
        direction: 'Išvykimas',
        days: 'Darbo dienomis',
        stops: [{ name: 'Ignalina', time: '07:30' }, { name: 'Baltys', time: '07:35' }, { name: 'Vidiškės', time: '07:40' }, { name: 'Maksimonys', time: '07:43' }, { name: 'Girininkija', time: '07:45' }, { name: 'N.Daugėliškis', time: '07:50' }],
      },
      {
        id: '61-out-1',
        routeNumber: '61',
        routeName: 'IGNALINA- MEIRONYS',
        direction: 'Išvykimas',
        days: 'Kasdien',
        stops: [{ name: 'Ignalina', time: '08:10' }, { name: 'Ligoninė', time: '08:12' }, { name: 'Akligatvis', time: '08:14' }, { name: 'Strigailiškis', time: '08:16' }, { name: 'Gaveikėnai', time: '08:21' }, { name: 'Dringykštis', time: '08:24' }, { name: 'Meironys I', time: '08:26' }, { name: 'Meironys II', time: '08:28' }],
      },
      {
        id: '69-out-1',
        routeNumber: '69',
        routeName: 'IGNALINA–GILŪTOS',
        direction: 'Išvykimas',
        days: 'Kasdien',
        stops: [{ name: 'Ignalina', time: '10:00' }, { name: 'Bėčiūnai I', time: '10:04' }, { name: 'Bėčiūnai II', time: '10:05' }, { name: 'Zuikos I', time: '10:07' }, { name: 'Zuikos II', time: '10:08' }, { name: 'Panižiškė', time: '10:10' }, { name: 'Ceikinėliai', time: '10:12' }, { name: 'Sauliai', time: '10:14' }, { name: 'Ceikiniai', time: '10:17' }, { name: 'Zatišius', time: '10:20' }, { name: 'Budriškė', time: '10:22' }, { name: 'Rubelninkai', time: '10:24' }, { name: 'Krikonys I', time: '10:26' }, { name: 'Krikonys II', time: '10:27' }, { name: 'Mielagėnai', time: '10:31' }, { name: 'Paliesiaus dvaras', time: '10:34' }, { name: 'Motiejiškė', time: '10:38' }, { name: 'Gilūtos', time: '10:42' }],
      },
      {
        id: '71-out-1',
        routeNumber: '71',
        routeName: 'IGNALINA- ANTALKSNĖ',
        direction: 'Išvykimas',
        days: 'Darbo dienomis',
        stops: [{ name: 'Ignalina', time: '06:30' }, { name: 'Ligoninė', time: '06:32' }, { name: 'Palūšė', time: '06:38' }, { name: 'Šakarva', time: '06:43' }, { name: 'Motiejūnai', time: '06:45' }, { name: 'Grikiapelė', time: '06:48' }, { name: 'Pupiškė', time: '06:50' }, { name: 'Linkmenys', time: '06:57' }, { name: 'Mozūriškė', time: '07:01' }, { name: 'Antalksnė', time: '07:05' }],
      }
    ];

    const dayTypes = ['Kasdien', 'Darbo dienomis', 'Šventinėmis'];

    const allRouteNumbers = Array.from(new Set(busTrips.map(t => t.routeNumber))).sort((a,b) => Number(a) - Number(b));

    const allStopsSet = new Set();
    busTrips.forEach(t => t.stops.forEach(s => allStopsSet.add(s.name.trim())));
    const allStops = Array.from(allStopsSet).sort();

    // --- PROGRAMOS KODAS ---
    function matchesQuery(trip, q) {
      const needle = q.trim().toLowerCase();
      if (!needle) return true;
      if (trip.routeNumber.toLowerCase().includes(needle)) return true;
      if (trip.routeName.toLowerCase().includes(needle)) return true;
      if (trip.direction.toLowerCase().includes(needle)) return true;
      return trip.stops.some(
        (s) => s.name.toLowerCase().includes(needle) || s.time.toLowerCase().includes(needle)
      );
    }

    function tripFirstTime(trip) {
      return trip.stops[0]?.time ?? '';
    }

    function App() {
      const [query, setQuery] = useState('');
      const [dayFilter, setDayFilter] = useState('Visos');
      const [routeFilter, setRouteFilter] = useState('Visi');
      const [stopFilter, setStopFilter] = useState('Visos');
      const [expandedId, setExpandedId] = useState(null);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [expandedId, query, dayFilter, routeFilter, stopFilter]);

      const filtered = useMemo(() => {
        return busTrips
          .filter((t) => dayFilter === 'Visos' || t.days === dayFilter)
          .filter((t) => routeFilter === 'Visi' || t.routeNumber === routeFilter)
          .filter((t) => stopFilter === 'Visos' || t.stops.some((s) => s.name === stopFilter))
          .filter((t) => matchesQuery(t, query))
          .sort((a, b) => tripFirstTime(a).localeCompare(tripFirstTime(b)));
      }, [query, dayFilter, routeFilter, stopFilter]);

      const hasActiveFilters =
        query.trim() !== '' || dayFilter !== 'Visos' || routeFilter !== 'Visi' || stopFilter !== 'Visos';

      const resetFilters = () => {
        setQuery('');
        setDayFilter('Visos');
        setRouteFilter('Visi');
        setStopFilter('Visos');
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900">
          <header className="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-200">
            <div className="max-w-5xl mx-auto px-4 py-4 flex items-center gap-3">
              <div className="flex items-center justify-center w-10 h-10 rounded-xl bg-emerald-600 text-white shadow-sm">
                <i data-lucide="bus" className="w-5 h-5"></i>
              </div>
              <div>
                <h1 className="text-lg font-semibold leading-tight">Ignalinos rajono autobusai</h1>
                <p className="text-xs text-slate-500">Maršrutų tvarkaraštis ir paieška</p>
              </div>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-4 py-6">
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 space-y-4">
              <div className="relative">
                <i data-lucide="search" className="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                <input
                  type="text"
                  value={query}
                  onChange={(e) => setQuery(e.target.value)}
                  placeholder="Ieškoti maršruto, stotelės ar laiko (pvz. Dūkštas, 51, 07:00)..."
                  className="w-full pl-11 pr-10 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 outline-none transition text-sm"
                />
                {query && (
                  <button
                    onClick={() => setQuery('')}
                    className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                )}
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <FilterSelect
                  icon="calendar-days"
                  label="Dienos"
                  value={dayFilter}
                  options={['Visos', ...dayTypes]}
                  onChange={setDayFilter}
                />
                <FilterSelect
                  icon="route"
                  label="Maršrutas"
                  value={routeFilter}
                  options={['Visi', ...allRouteNumbers]}
                  onChange={setRouteFilter}
                />
                <FilterSelect
                  icon="map-pin"
                  label="Stotelė"
                  value={stopFilter}
                  options={['Visos', ...allStops]}
                  onChange={setStopFilter}
                />
              </div>

              {hasActiveFilters && (
                <div className="flex items-center justify-between pt-1">
                  <span className="text-xs text-slate-500">
                    Rasta: <span className="font-semibold text-slate-700">{filtered.length}</span> {filtered.length === 1 ? 'išvykimas' : 'išvykimų'}
                  </span>
                  <button
                    onClick={resetFilters}
                    className="text-xs font-medium text-emerald-600 hover:text-emerald-700 flex items-center gap-1"
                  >
                    <i data-lucide="x" className="w-3.5 h-3.5"></i> Išvalyti filtrus
                  </button>
                </div>
              )}
            </div>

            <div className="mt-6 space-y-3">
              {filtered.length === 0 ? (
                <div className="bg-white rounded-2xl border border-slate-200 p-10 text-center">
                  <div className="mx-auto w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center mb-3">
                    <i data-lucide="search" className="w-6 h-6 text-slate-400"></i>
                  </div>
                  <p className="font-medium text-slate-700">Nieko nerasta</p>
                  <p className="text-sm text-slate-500 mt-1">Pakeiskite paieškos žodį ar filtrus.</p>
                </div>
              ) : (
                filtered.map((trip) => {
                  const expanded = expandedId === trip.id;
                  return (
                    <article key={trip.id} className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden transition hover:shadow-md">
                      <button
                        onClick={() => setExpandedId(expanded ? null : trip.id)}
                        className="w-full text-left p-4 flex items-center gap-4"
                      >
                        <div className="flex-shrink-0 w-12 h-12 rounded-xl bg-emerald-50 text-emerald-700 font-bold flex items-center justify-center text-lg">
                          {trip.routeNumber}
                        </div>
                        <div className="flex-1 min-w-0">
                          <h2 className="font-semibold text-slate-900 truncate">{trip.routeName}</h2>
                          <div className="flex flex-wrap items-center gap-x-3 gap-y-1 mt-1 text-xs text-slate-500">
                            <span className="inline-flex items-center gap-1">
                              <i data-lucide="clock" className="w-3.5 h-3.5"></i> {tripFirstTime(trip)}
                            </span>
                            <span className="inline-flex items-center gap-1">
                              <i data-lucide="map-pin" className="w-3.5 h-3.5"></i> {trip.stops.length} stot.
                            </span>
                            <span className="inline-flex items-center gap-1">
                              <i data-lucide="calendar-days" className="w-3.5 h-3.5"></i> {trip.days}
                            </span>
                            <span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">
                              {trip.direction} → {trip.stops[trip.stops.length - 1]?.name}
                            </span>
                          </div>
                        </div>
                        <div className="flex-shrink-0 text-slate-400">
                          <i data-lucide="chevron-down" className={`w-5 h-5 transition-transform ${expanded ? 'rotate-180' : ''}`}></i>
                        </div>
                      </button>

                      {expanded && (
                        <div className="border-t border-slate-100 bg-slate-50/50 px-4 py-4">
                          <div className="flex items-center gap-2 mb-3">
                            <span className="text-xs font-medium px-2 py-1 rounded-full bg-emerald-100 text-emerald-700">
                              {trip.direction}
                            </span>
                          </div>
                          <ol className="relative border-l-2 border-emerald-200 ml-2 space-y-3">
                            {trip.stops.map((stop, i) => (
                              <li key={i} className="pl-4 relative">
                                <span className="absolute -left-[7px] top-1 w-3 h-3 rounded-full bg-emerald-500 ring-2 ring-white" />
                                <div className="flex items-baseline justify-between gap-3">
                                  <span className="text-sm font-medium text-slate-800">{stop.name}</span>
                                  <span className="text-sm font-semibold text-emerald-700 tabular-nums">{stop.time}</span>
                                </div>
                              </li>
                            ))}
                          </ol>
                        </div>
                      )}
                    </article>
                  );
                })
              )}
            </div>

            <footer className="mt-10 text-center text-xs text-slate-400">
              <p>Ignalinos rajono autobusų grafikas. Duomenys pateikti informaciniais tikslais.</p>
            </footer>
          </main>
        </div>
      );
    }

    function FilterSelect({ icon, label, value, options, onChange }) {
      return (
        <label className="block">
          <span className="sr-only">{label}</span>
          <div className="relative">
            <div className="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
              <i data-lucide={icon} className="w-4 h-4"></i>
            </div>
            <select
              value={value}
              onChange={(e) => onChange(e.target.value)}
              className="w-full pl-9 pr-8 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm font-medium text-slate-700 focus:bg-white focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 outline-none transition appearance-none cursor-pointer"
            >
              {options.map((opt) => (
                <option key={opt} value={opt}>
                  {opt === 'Visos' || opt === 'Visi' ? `${label}: visos` : `${label}: ${opt}`}
                </option>
              ))}
            </select>
            <i data-lucide="chevron-down" className="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"></i>
          </div>
        </label>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
