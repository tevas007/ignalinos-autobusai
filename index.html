<!DOCTYPE html>
<html lang="lt">
<head>
    <base href="/autobusai/">
    <script defer src="/_vercel/insights/script.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignalinos Autobusų Tvarkaraščiai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">

    <script>
        window.allRoutes = [];
        function registerRoute(routeData) {
            window.allRoutes.push(routeData);
        }

        async function loadAllRoutes() {
            if (!window.routeManifest || !Array.isArray(window.routeManifest)) {
                console.error("Manifestas nerastas");
                return;
            }

            for (const file of window.routeManifest) {
                await new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = `./routes/${file}.js`;
                    script.onload = resolve;
                    script.onerror = reject;
                    document.head.appendChild(script);
                });
            }

            window.allRoutes.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
            initApp();
        }
    </script>

    <script src="./routes/manifest.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- Header (Pilno pločio viršutinė juosta) -->
  <header class="bg-white border-b border-slate-200 py-4 px-6 sticky top-0 z-10 shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3 font-bold text-slate-900 text-lg">
        <img src="herbas.svg" alt="Ignalinos herbas" class="w-8 h-10 object-contain" onerror="this.style.display='none'">
        <span>Ignalinos Autobusai</span>
      </div>
      <div class="flex items-center gap-4">
        <!-- PWA Diegimo mygtukas -->
        <button id="installBtn" style="display: none;" class="bg-blue-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg hover:bg-blue-700 transition-colors">
          Įsidiegti
        </button>
        <a href="/" class="text-sm font-medium text-blue-600 hover:text-blue-700">← Ignalinos Paslaugos</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full space-y-6">
    <div class="text-center space-y-2">
      <h1 class="text-3xl font-extrabold text-slate-900">Autobusų Tvarkaraščiai</h1>
      <p class="text-slate-500 text-sm">Oficialūs vietiniai Ignalinos rajono maršrutai ir stotelių laikai</p>
    </div>

    <!-- Route Selector Card -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-2">
      <label class="block text-xs font-semibold text-slate-400">PASIRINKITE MARŠRUTĄ</label>
      <select id="routeSelect" onchange="changeRoute()" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-blue-700 font-bold focus:outline-none focus:ring-2 focus:ring-blue-500">
      </select>
      <div class="text-xs text-slate-400 font-medium px-1" id="routeInfo">-</div>
    </div>

    <!-- Search Input Card -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
      <label class="block text-xs font-semibold text-slate-400 mb-1">PAIEŠKA PAGAL STOTELĘ</label>
      <input type="text" id="search" placeholder="Ieškoti stotelės bet kuriame maršrute..." oninput="filterStops()" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 font-medium focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <!-- Trip Selection Buttons -->
    <div id="tripTabs" class="flex gap-2 overflow-x-auto pb-1">
      <button id="btn1" onclick="switchTrip(1)" class="px-4 py-2 rounded-xl text-sm font-semibold transition-all whitespace-nowrap bg-blue-600 text-white shadow">1 Reisas</button>
      <button id="btn2" onclick="switchTrip(2)" class="px-4 py-2 rounded-xl text-sm font-semibold transition-all whitespace-nowrap bg-white text-slate-600 border border-slate-200 hover:bg-slate-100">2 Reisas</button>
    </div>

    <!-- Schedule Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-4 bg-slate-100 border-b border-slate-200 flex justify-between items-center text-xs font-bold text-slate-500 tracking-wider">
        <span>LAIKAS</span>
        <span>STOTELĖ</span>
        <span>ATSTUMAS</span>
      </div>
      <div id="stopsList" class="divide-y divide-slate-100">
        <!-- Stops populated by JS -->
      </div>
    </div>
  </main>

  <footer class="py-6 text-center text-xs text-slate-400 border-t border-slate-200 bg-white">
    © 2026 Ignalinos Paslaugos.
  </footer>

<script>
let currentRoute = null;
let currentTripNum = 1;
let deferredPrompt = null;

// PWA diegimo logika
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    const installBtn = document.getElementById('installBtn');
    installBtn.style.display = 'block';

    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                installBtn.style.display = 'none';
            }
            deferredPrompt = null;
        }
    });
});

function initApp() {
    populateSelect();
    if (window.allRoutes.length > 0) {
        selectRoute(0);
    }
}

function populateSelect() {
    const select = document.getElementById('routeSelect');
    select.innerHTML = window.allRoutes.map((r, i) => `<option value="${i}">${r.name}: ${r.title}</option>`).join('');
}

function changeRoute() {
    const idx = document.getElementById('routeSelect').value;
    selectRoute(idx);
    document.getElementById('search').value = '';
}

function selectRoute(index) {
    currentRoute = window.allRoutes[index];
    document.getElementById('routeInfo').innerText = `${currentRoute.subtitle} (Rida: ${currentRoute.distance})`;
    
    document.getElementById('btn1').innerText = `1 Reisas (${currentRoute.trip1_name})`;
    document.getElementById('btn2').innerText = `2 Reisas (${currentRoute.trip2_name})`;
    
    switchTrip(1);
}

function switchTrip(tripNum) {
    currentTripNum = tripNum;
    
    const activeClass = "px-4 py-2 rounded-xl text-sm font-semibold transition-all whitespace-nowrap bg-blue-600 text-white shadow";
    const inactiveClass = "px-4 py-2 rounded-xl text-sm font-semibold transition-all whitespace-nowrap bg-white text-slate-600 border border-slate-200 hover:bg-slate-100";

    document.getElementById('btn1').className = tripNum === 1 ? activeClass : inactiveClass;
    document.getElementById('btn2').className = tripNum === 2 ? activeClass : inactiveClass;

    filterStops();
}

function filterStops() {
    const query = document.getElementById('search').value.toLowerCase().trim();
    const list = document.getElementById('stopsList');
    const tripTabs = document.getElementById('tripTabs');

    if (!query) {
        tripTabs.style.display = 'flex';
        if (!currentRoute) return;
        const stops = currentTripNum === 1 ? currentRoute.trip1_stops : currentRoute.trip2_stops;
        renderStopsList(stops);
        return;
    }

    tripTabs.style.display = 'none';
    let allResults = [];

    window.allRoutes.forEach((route, routeIndex) => {
        if (route.trip1_stops) {
            route.trip1_stops.forEach(s => {
                if (s.name.toLowerCase().includes(query)) {
                    allResults.push({
                        ...s,
                        routeName: `${route.name}: ${route.title}`,
                        tripName: `1 Reisas (${route.trip1_name})`,
                        routeIndex: routeIndex,
                        tripNum: 1
                    });
                }
            });
        }
        if (route.trip2_stops) {
            route.trip2_stops.forEach(s => {
                if (s.name.toLowerCase().includes(query)) {
                    allResults.push({
                        ...s,
                        routeName: `${route.name}: ${route.title}`,
                        tripName: `2 Reisas (${route.trip2_name})`,
                        routeIndex: routeIndex,
                        tripNum: 2
                    });
                }
            });
        }
    });

    if (allResults.length === 0) {
        list.innerHTML = `<div class="p-6 text-center text-slate-400 font-medium text-sm">Nerasta stotelių pagal užklausą „${query}“</div>`;
        return;
    }

    list.innerHTML = allResults.map(s => `
        <div class="p-4 hover:bg-blue-50/50 transition-colors cursor-pointer flex flex-col gap-1" onclick="jumpToRouteAndStop(${s.routeIndex}, ${s.tripNum})">
            <div class="text-xs font-semibold text-blue-600">${s.routeName} — ${s.tripName}</div>
            <div class="flex justify-between items-center">
                <span class="font-extrabold text-blue-600 font-mono text-base">${s.time}</span>
                <span class="font-semibold text-slate-800">${s.name}</span>
                <span class="text-xs text-slate-400 font-mono">${s.dist}</span>
            </div>
        </div>
    `).join('');
}

function renderStopsList(stops) {
    const list = document.getElementById('stopsList');
    list.innerHTML = stops.map(s => `
        <div class="p-4 flex justify-between items-center hover:bg-blue-50/50 transition-colors">
            <span class="font-extrabold text-blue-600 font-mono text-base">${s.time}</span>
            <span class="font-semibold text-slate-800">${s.name}</span>
            <span class="text-xs text-slate-400 font-mono">${s.dist}</span>
        </div>
    `).join('');
}

function jumpToRouteAndStop(routeIndex, tripNum) {
    document.getElementById('routeSelect').value = routeIndex;
    selectRoute(routeIndex);
    switchTrip(tripNum);
    document.getElementById('search').value = '';
    document.getElementById('tripTabs').style.display = 'flex';
}

window.addEventListener('DOMContentLoaded', loadAllRoutes);
</script>

<script>
window.addEventListener('DOMContentLoaded', () => {
    const ua = navigator.userAgent;
    let device = 'Desktop';
    if (/android/i.test(ua)) device = 'Android';
    else if (/iphone|ipad|ipod/i.test(ua)) device = 'iOS';

    const now = new Date();
    const timeStr = now.toTimeString().split(' ')[0];

    fetch('/api/notify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ device, time: timeStr })
    }).catch(err => console.log('Klaida'));
});
</script>

</body>
</html>
