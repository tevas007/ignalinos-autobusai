<!DOCTYPE html>
<html lang="lt">
<head>
    <script defer src="/_vercel/insights/script.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignalinos Autobusų Tvarkaraščiai</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">

    <script>
        window.allRoutes = [];
        function registerRoute(routeData) {
            window.allRoutes.push(routeData);
        }

        async function loadAllRoutes() {
            if (!window.routeManifest || !Array.isArray(window.routeManifest)) {
                console.error("Manifestas nerastas");
                return;
            }

            for (const file of window.routeManifest) {
                await new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = `./routes/${file}.js`;
                    script.onload = resolve;
                    script.onerror = reject;
                    document.head.appendChild(script);
                });
            }

            window.allRoutes.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
            initApp();
        }
    </script>

    <script src="./routes/manifest.js"></script>
</head>
<body>

<div class="container">
    <!-- Viršutinė kortelė su maršrutu ir paslėptu/rodomu diegimo mygtuku -->
    <div class="route-select-card" style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
        <div style="flex: 1;">
            <select id="routeSelect" onchange="changeRoute()"></select>
            <div class="route-info" id="routeInfo">-</div>
        </div>
        <!-- Diegimo mygtukas (iš pradžių paslėptas, kol naršyklė leis įdiegti) -->
        <button id="installBtn" style="display: none; background: var(--primary); color: white; border: none; padding: 10px 12px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; white-space: nowrap;">
            Įsidiegti
        </button>
    </div>

    <div class="tabs" id="tripTabs">
        <button class="tab-btn active" id="btn1" onclick="switchTrip(1)">1 Reisas</button>
        <button class="tab-btn" id="btn2" onclick="switchTrip(2)">2 Reisas</button>
    </div>

    <div class="route-select-card">
        <input type="text" id="search" placeholder="Ieškoti stotelės bet kuriame maršrute..." oninput="filterStops()">
    </div>

    <div class="stops-card" id="stopsList"></div>
</div>

<script>
let currentRoute = null;
let currentTripNum = 1;
let deferredPrompt = null;

// PWA diegimo logika
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    const installBtn = document.getElementById('installBtn');
    installBtn.style.display = 'block';

    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                installBtn.style.display = 'none';
            }
            deferredPrompt = null;
        }
    });
});

function initApp() {
    populateSelect();
    if (window.allRoutes.length > 0) {
        selectRoute(0);
    }
}

function populateSelect() {
    const select = document.getElementById('routeSelect');
    select.innerHTML = window.allRoutes.map((r, i) => `<option value="${i}">${r.name}: ${r.title}</option>`).join('');
}

function changeRoute() {
    const idx = document.getElementById('routeSelect').value;
    selectRoute(idx);
    // Kai pakeičiam maršrutą per išskleidžiamą meniu, išvalome paiešką, kad rodytų įprastą reisą
    document.getElementById('search').value = '';
}

function selectRoute(index) {
    currentRoute = window.allRoutes[index];
    document.getElementById('routeInfo').innerText = `${currentRoute.subtitle} (Rida: ${currentRoute.distance})`;
    
    document.getElementById('btn1').innerText = `1 Reisas (${currentRoute.trip1_name})`;
    document.getElementById('btn2').innerText = `2 Reisas (${currentRoute.trip2_name})`;
    
    switchTrip(1);
}

function switchTrip(tripNum) {
    currentTripNum = tripNum;
    document.getElementById('btn1').classList.toggle('active', tripNum === 1);
    document.getElementById('btn2').classList.toggle('active', tripNum === 2);
    // Jei vartotojas ieškojo laukelyje, perjungus reisą atnaujiname paiešką
    filterStops();
}

function filterStops() {
    const query = document.getElementById('search').value.toLowerCase().trim();
    const list = document.getElementById('stopsList');
    const tripTabs = document.getElementById('tripTabs');

    // Jei paieškos laukelis tuščias – rodome įprastą pasirinkto maršruto reisą ir grąžiname mygtukus
    if (!query) {
        tripTabs.style.display = 'flex';
        if (!currentRoute) return;
        const stops = currentTripNum === 1 ? currentRoute.trip1_stops : currentRoute.trip2_stops;
        renderStopsList(stops);
        return;
    }

    // Jei kažkas įrašyta – ieškome per VISUS maršrutus ir abu reisus!
    tripTabs.style.display = 'none'; // Paslėpiame 1/2 reiso tab'us paieškos metu, kad nesipainiotų
    let allResults = [];

    window.allRoutes.forEach((route, routeIndex) => {
        // Tikrinam 1 reisą
        if (route.trip1_stops) {
            route.trip1_stops.forEach(s => {
                if (s.name.toLowerCase().includes(query)) {
                    allResults.push({
                        ...s,
                        routeName: `${route.name}: ${route.title}`,
                        tripName: `1 Reisas (${route.trip1_name})`,
                        routeIndex: routeIndex,
                        tripNum: 1
                    });
                }
            });
        }
        // Tikrinam 2 reisą
        if (route.trip2_stops) {
            route.trip2_stops.forEach(s => {
                if (s.name.toLowerCase().includes(query)) {
                    allResults.push({
                        ...s,
                        routeName: `${route.name}: ${route.title}`,
                        tripName: `2 Reisas (${route.trip2_name})`,
                        routeIndex: routeIndex,
                        tripNum: 2
                    });
                }
            });
        }
    });

    if (allResults.length === 0) {
        list.innerHTML = `<div style="padding: 20px; text-align: center; color: #666;">Nerasta stotelių pagal užklausą „${query}“</div>`;
        return;
    }

    // Atvaizduojame rezultatus kartu su maršruto ir reiso pavadinimu
    list.innerHTML = allResults.map(s => `
        <div class="stop-item" style="cursor: pointer; flex-direction: column; align-items: flex-start; gap: 4px;" onclick="jumpToRouteAndStop(${s.routeIndex}, ${s.tripNum})">
            <div style="font-size: 0.8rem; font-weight: 600; color: var(--primary);">${s.routeName} — ${s.tripName}</div>
            <div style="display: flex; width: 100%; justify-content: space-between;">
                <span class="stop-time">${s.time}</span>
                <span class="stop-name" style="font-weight: 600;">${s.name}</span>
                <span class="stop-dist">${s.dist}</span>
            </div>
        </div>
    `).join('');
}

function renderStopsList(stops) {
    const list = document.getElementById('stopsList');
    list.innerHTML = stops.map(s => `
        <div class="stop-item">
            <span class="stop-time">${s.time}</span>
            <span class="stop-name">${s.name}</span>
            <span class="stop-dist">${s.dist}</span>
        </div>
    `).join('');
}

// Funkcija, kad paspaudus ant rastos stotelės iškart peršoktų į tą maršrutą
function jumpToRouteAndStop(routeIndex, tripNum) {
    document.getElementById('routeSelect').value = routeIndex;
    selectRoute(routeIndex);
    switchTrip(tripNum);
    document.getElementById('search').value = '';
    document.getElementById('tripTabs').style.display = 'flex';
}

window.addEventListener('DOMContentLoaded', loadAllRoutes);
</script>

<script>
window.addEventListener('DOMContentLoaded', () => {
    const ua = navigator.userAgent;
    let device = 'Desktop';
    if (/android/i.test(ua)) device = 'Android';
    else if (/iphone|ipad|ipod/i.test(ua)) device = 'iOS';

    const now = new Date();
    const timeStr = now.toTimeString().split(' ')[0];

    fetch('/api/notify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ device, time: timeStr })
    }).catch(err => console.log('Klaida'));
});
</script>

</body>
</html>
