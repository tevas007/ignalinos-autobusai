<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignalinos Autobusų Tvarkaraščiai</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">

    <script>
        window.allRoutes = [];
        function registerRoute(routeData) {
            window.allRoutes.push(routeData);
        }

        async function loadAllRoutes() {
            if (!window.routeManifest || !Array.isArray(window.routeManifest)) {
                console.error("Manifestas nerastas");
                return;
            }

            for (const file of window.routeManifest) {
                await new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = `./routes/${file}.js`;
                    script.onload = resolve;
                    script.onerror = reject;
                    document.head.appendChild(script);
                });
            }

            window.allRoutes.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
            initApp();
        }
    </script>

    <script src="./routes/manifest.js"></script>
</head>
<body>

<div class="container">
    <!-- Viršutinė kortelė su maršrutu ir paslėptu/rodomu diegimo mygtuku -->
    <div class="route-select-card" style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
        <div style="flex: 1;">
            <select id="routeSelect" onchange="changeRoute()"></select>
            <div class="route-info" id="routeInfo">-</div>
        </div>
        <!-- Diegimo mygtukas (iš pradžių paslėptas, kol naršyklė leis įdiegti) -->
        <button id="installBtn" style="display: none; background: var(--primary); color: white; border: none; padding: 10px 12px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; white-space: nowrap;">
            Įsidiegti
        </button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="btn1" onclick="switchTrip(1)">1 Reisas</button>
        <button class="tab-btn" id="btn2" onclick="switchTrip(2)">2 Reisas</button>
    </div>

    <div class="route-select-card">
        <input type="text" id="search" placeholder="Ieškoti stotelės..." oninput="filterStops()">
    </div>

    <div class="stops-card" id="stopsList"></div>
</div>

<script>
let currentRoute = null;
let currentTripNum = 1;
let deferredPrompt = null;

// PWA diegimo logika
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    const installBtn = document.getElementById('installBtn');
    installBtn.style.display = 'block'; // Parodome mygtuką tik tada, kai galima įdiegti

    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                installBtn.style.display = 'none';
            }
            deferredPrompt = null;
        }
    });
});

function initApp() {
    populateSelect();
    if (window.allRoutes.length > 0) {
        selectRoute(0);
    }
}

function populateSelect() {
    const select = document.getElementById('routeSelect');
    select.innerHTML = window.allRoutes.map((r, i) => `<option value="${i}">${r.name}: ${r.title}</option>`).join('');
}

function changeRoute() {
    const idx = document.getElementById('routeSelect').value;
    selectRoute(idx);
}

function selectRoute(index) {
    currentRoute = window.allRoutes[index];
    document.getElementById('routeInfo').innerText = `${currentRoute.subtitle} (Rida: ${currentRoute.distance})`;
    
    document.getElementById('btn1').innerText = `1 Reisas (${currentRoute.trip1_name})`;
    document.getElementById('btn2').innerText = `2 Reisas (${currentRoute.trip2_name})`;
    
    switchTrip(1);
}

function switchTrip(tripNum) {
    currentTripNum = tripNum;
    document.getElementById('btn1').classList.toggle('active', tripNum === 1);
    document.getElementById('btn2').classList.toggle('active', tripNum === 2);
    filterStops();
}

function filterStops() {
    if (!currentRoute) return;
    const query = document.getElementById('search').value.toLowerCase();
    const stops = currentTripNum === 1 ? currentRoute.trip1_stops : currentRoute.trip2_stops;
    const filtered = stops.filter(s => s.name.toLowerCase().includes(query));
    
    const list = document.getElementById('stopsList');
    list.innerHTML = filtered.map(s => `
        <div class="stop-item">
            <span class="stop-time">${s.time}</span>
            <span class="stop-name">${s.name}</span>
            <span class="stop-dist">${s.dist}</span>
        </div>
    `).join('');
}

window.addEventListener('DOMContentLoaded', loadAllRoutes);
</script>

</body>
</html>
